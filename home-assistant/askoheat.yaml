# Home Assistant : connexion au simulateur (ou plus tard au vrai ASKOHEAT+)
# Fichier « package » : dans configuration.yaml, ajouter
#   homeassistant:
#     packages:
#       askoheat: !include packages/askoheat.yaml
# puis copier ce fichier dans config/packages/askoheat.yaml.
#
# Pour passer au vrai appareil, il suffit de changer "host" (et "port: 502").
# L'identifiant d'unité est omis : l'ASKOHEAT+ l'ignore (et la clé change selon la version de HA).

modbus:
  - name: askoheat
    type: tcp
    host: askoheatsim.askoheatsim.svc.cluster.local   # le vrai appareil : son IP
    port: 502
    timeout: 5
    sensors:
      - name: Askoheat température haut
        unique_id: askoheat_temp_haut
        address: 100                 # sonde 1
        input_type: input
        data_type: uint16
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        scan_interval: 10
      - name: Askoheat température bride
        unique_id: askoheat_temp_bride
        address: 714                 # sonde 0, float32 (706-715 = sondes 4..0)
        input_type: input
        data_type: float32
        precision: 1
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        scan_interval: 10
      - name: Askoheat puissance
        unique_id: askoheat_puissance
        address: 110
        input_type: input
        data_type: uint16
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        scan_interval: 5
      - name: Askoheat état
        unique_id: askoheat_etat
        address: 109
        input_type: input
        data_type: uint16
        scan_interval: 5
      - name: Askoheat injection reçue
        unique_id: askoheat_injection_recue
        address: 202
        input_type: holding
        data_type: int16
        unit_of_measurement: W
        scan_interval: 10

# ---------------------------------------------------------------------------
# Automation : envoyer la puissance réseau toutes les 10 s (watchdog = 60 s).
# gPlug (package gplug) : sensor.gplug_puissance_soutiree et sensor.gplug_puissance_injectee, en W.
# Valeur envoyée = soutirage − injection, en W (négatif = surplus), convertie en
# complément à deux (registre int16).
# Avec le simulateur : laisser cochée la case « La mesure envoyée n'inclut pas le corps de
# chauffe simulé ». Décochée, le simulateur ignore ces écritures et simule lui-même la mesure.
# L'onglet « Configuration Home Assistant » du simulateur génère d'autres variantes (201, 200, 0-10 V).
automation:
  - alias: "ASKOHEAT – envoyer la valeur d'injection"
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: time_pattern
        seconds: "/10"
    conditions:
      - condition: template
        value_template: >-
          {{ has_value('sensor.gplug_puissance_soutiree')
             and has_value('sensor.gplug_puissance_injectee') }}
    actions:
      - action: modbus.write_register
        data:
          hub: askoheat
          address: 202
          value: >-
            {% set p = (states('sensor.gplug_puissance_soutiree') | float(0)
                        - states('sensor.gplug_puissance_injectee') | float(0)) | round(0) | int %}
            {{ ([[-30000, p] | max, 30000] | min) % 65536 }}
