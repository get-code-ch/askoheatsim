# Déployé par Argo CD (Application askoheatsim, définie dans talos_joran_local/23_askoheatsim).
# Le namespace vient de destination.namespace de l'Application.
# Le code est monté depuis une ConfigMap dans l'image officielle python:3.13-slim : pas d'image à construire.
# (Le Dockerfile et compose.yaml servent uniquement hors du cluster.)
# Test manuel : kubectl apply -k . -n <namespace>
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - k8s/deployment.yaml
  - k8s/pvc.yaml
configMapGenerator:
  - name: askoheatsim-code
    files:
      - askoheat_sim.py
      - household.py
      - registers.py
      - index.html
      - app.js
      - trace.js
      - config.js
