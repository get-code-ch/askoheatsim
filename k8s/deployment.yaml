apiVersion: apps/v1
kind: Deployment
metadata:
  name: askoheatsim
  labels: {app: askoheatsim}
spec:
  replicas: 1                      # un seul : l'état du chauffe-eau est en mémoire
  selector:
    matchLabels: {app: askoheatsim}
  template:
    metadata:
      labels: {app: askoheatsim}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: sim
          image: python:3.13-slim
          command: ["python", "/app/askoheat_sim.py"]
          env:
            - {name: MODBUS_PORT, value: "5020"}
            - {name: HTTP_PORT, value: "8080"}
            - {name: TANK_LITERS, value: "300"}
            - {name: START_TEMP, value: "45"}
            # Configuration fixée au déploiement (affichée en lecture seule dans l'interface)
            # reg. 502 : bits 2-7 injection, consigne, étage, 0-10 V, contact PAC, secours ; bit 9 température minimale
            - {name: INPUT_SETTING, value: "0x2FC"}
            - {name: MIN_TEMP, value: "45"}             # reg. 595 : température minimale maintenue (°C)
            - {name: AUTO_OFF, value: "0b01"}           # reg. 504 : bit0 arrêt après 60 s, bit1 redémarrage auto
            # Mode au démarrage (modifiable dans l'interface) : true = piloté par HA (port Modbus ouvert) ;
            # false = autonome (port Modbus fermé, le simulateur calcule lui-même la mesure)
            - {name: COMPENSATE, value: "true"}
            - {name: TZ_NAME, value: "Europe/Zurich"}
            - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
            - {name: PYTHONUNBUFFERED, value: "1"}
          ports:
            - {name: modbus, containerPort: 5020}
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 96Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: code, mountPath: /app, readOnly: true}
      volumes:
        - name: code
          configMap:
            name: askoheatsim-code
---
apiVersion: v1
kind: Service
metadata:
  name: askoheatsim
spec:
  selector: {app: askoheatsim}
  ports:
    - {name: modbus, port: 502, targetPort: modbus}   # HA se connecte sur le port standard
    - {name: http, port: 8080, targetPort: http}
